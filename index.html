<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aruvi Collection - POS System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#10b981', // Emerald 500
                        primaryHover: '#059669', // Emerald 600
                        secondary: '#475569', // Slate 600
                        dark: '#0f172a', // Slate 900
                        light: '#f8fafc', // Slate 50
                    },
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 h-screen overflow-hidden flex font-sans selection:bg-emerald-200 selection:text-emerald-900">

    <!-- Sidebar -->
    <aside id="sidebar" class="w-64 bg-white border-r border-slate-200 flex flex-col transition-all duration-300 z-20 absolute md:relative h-full -translate-x-full md:translate-x-0">
        <div class="h-20 flex items-center px-6 bg-[#215348] justify-between md:justify-center">
            <h1 class="flex items-center justify-center h-full py-2">
                <img src="assets/images/WhatsApp%20Image%202026-09-21%20at%207.49.20%20AM.jpeg" alt="Aruvi Logo" class="h-16 w-auto object-contain">
                <span id="sidebar-shop-name" class="hidden">Aruvi POS</span>
            </h1>
            <button id="close-sidebar" class="md:hidden text-emerald-100 hover:text-white">
                <i class="fa-solid fa-times text-xl"></i>
            </button>
        </div>
        
        <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1 custom-scrollbar">
            <a href="#" data-page="dashboard" class="nav-link active flex items-center px-3 py-2.5 rounded-lg text-slate-600 hover:bg-emerald-50 hover:text-primary transition-colors">
                <i class="fa-solid fa-chart-pie w-6 text-center"></i>
                <span class="ml-3 font-medium">Dashboard</span>
            </a>
            <a href="#" data-page="pos" class="nav-link flex items-center px-3 py-2.5 rounded-lg text-slate-600 hover:bg-emerald-50 hover:text-primary transition-colors">
                <i class="fa-solid fa-cash-register w-6 text-center"></i>
                <span class="ml-3 font-medium">POS Billing</span>
            </a>
            
            <div class="pt-4 pb-2 px-3">
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Management</p>
            </div>
            
            <a href="#" data-page="products" class="nav-link flex items-center px-3 py-2.5 rounded-lg text-slate-600 hover:bg-emerald-50 hover:text-primary transition-colors">
                <i class="fa-solid fa-box-open w-6 text-center"></i>
                <span class="ml-3 font-medium">Products</span>
            </a>
            <a href="#" data-page="inventory" class="nav-link flex items-center px-3 py-2.5 rounded-lg text-slate-600 hover:bg-emerald-50 hover:text-primary transition-colors">
                <i class="fa-solid fa-warehouse w-6 text-center"></i>
                <span class="ml-3 font-medium">Inventory</span>
            </a>
            <a href="#" data-page="customers" class="nav-link flex items-center px-3 py-2.5 rounded-lg text-slate-600 hover:bg-emerald-50 hover:text-primary transition-colors">
                <i class="fa-solid fa-users w-6 text-center"></i>
                <span class="ml-3 font-medium">Customers</span>
            </a>
            
            <div class="pt-4 pb-2 px-3">
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Finance</p>
            </div>
            
            <a href="#" data-page="history" class="nav-link flex items-center px-3 py-2.5 rounded-lg text-slate-600 hover:bg-emerald-50 hover:text-primary transition-colors">
                <i class="fa-solid fa-file-invoice-dollar w-6 text-center"></i>
                <span class="ml-3 font-medium">Billing History</span>
            </a>
            <a href="#" data-page="returns" class="nav-link flex items-center px-3 py-2.5 rounded-lg text-slate-600 hover:bg-emerald-50 hover:text-primary transition-colors">
                <i class="fa-solid fa-arrow-rotate-left w-6 text-center"></i>
                <span class="ml-3 font-medium">Returns / Cancel</span>
            </a>
            <a href="#" data-page="reports" class="nav-link flex items-center px-3 py-2.5 rounded-lg text-slate-600 hover:bg-emerald-50 hover:text-primary transition-colors">
                <i class="fa-solid fa-chart-line w-6 text-center"></i>
                <span class="ml-3 font-medium">Reports</span>
            </a>
            
            <div class="pt-4 pb-2 px-3">
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">System</p>
            </div>
            
            <a href="#" data-page="settings" class="nav-link flex items-center px-3 py-2.5 rounded-lg text-slate-600 hover:bg-emerald-50 hover:text-primary transition-colors">
                <i class="fa-solid fa-gear w-6 text-center"></i>
                <span class="ml-3 font-medium">Settings</span>
            </a>
        </nav>
        
        <div class="p-4 border-t border-slate-200">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-emerald-100 flex items-center justify-center text-primary font-bold">
                    A
                </div>
                <div>
                    <p class="text-sm font-semibold">Admin User</p>
                    <p class="text-xs text-slate-500">Store Manager</p>
                </div>
            </div>
        </div>
    </aside>

    <!-- Overlay for mobile sidebar -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/50 z-10 hidden md:hidden backdrop-blur-sm transition-opacity"></div>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full overflow-hidden bg-slate-50">
        
        <!-- Top Navbar -->
        <header class="h-20 bg-white border-b border-slate-200 flex items-center justify-between px-4 lg:px-8 z-10 shadow-sm">
            <div class="flex items-center gap-4">
                <button id="open-sidebar" class="md:hidden text-slate-500 hover:text-slate-800 p-2 rounded-lg hover:bg-slate-100">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
                <h2 id="page-title" class="text-xl font-semibold text-slate-800">Dashboard</h2>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="hidden sm:flex items-center bg-slate-100 rounded-lg px-3 py-1.5 border border-slate-200">
                    <i class="fa-regular fa-clock text-slate-400 mr-2"></i>
                    <span id="current-time" class="text-sm font-medium text-slate-600">--:--:--</span>
                </div>
                <button class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-600 hover:bg-slate-200 hover:text-primary transition-colors relative">
                    <i class="fa-regular fa-bell"></i>
                    <span class="absolute top-2 right-2.5 w-2 h-2 bg-primary rounded-full border border-white"></span>
                </button>
                <button id="btn-new-sale" class="hidden sm:flex items-center gap-2 bg-primary hover:bg-primaryHover text-white px-4 py-2 rounded-lg font-medium transition-colors shadow-sm shadow-emerald-200">
                    <i class="fa-solid fa-plus"></i> New Sale
                </button>
            </div>
        </header>

        <!-- Pages Container -->
        <div id="pages-container" class="flex-1 overflow-y-auto relative">
            
            <!-- Dashboard Page -->
            <div id="page-dashboard" class="page-section p-4 lg:p-8 active-page">
                <!-- Dashboard content will be injected by JS -->
            </div>

            <!-- POS Page -->
            <div id="page-pos" class="page-section hidden h-full">
                <!-- POS content injected by JS -->
            </div>

            <!-- Products Page -->
            <div id="page-products" class="page-section p-4 lg:p-8 hidden">
                <!-- Products content injected by JS -->
            </div>

            <!-- Inventory Page -->
            <div id="page-inventory" class="page-section p-4 lg:p-8 hidden">
                <!-- Inventory content injected by JS -->
            </div>

            <!-- Customers Page -->
            <div id="page-customers" class="page-section p-4 lg:p-8 hidden">
                <!-- Customers content -->
            </div>

            <!-- History Page -->
            <div id="page-history" class="page-section p-4 lg:p-8 hidden">
                <!-- History content -->
            </div>

            <!-- Returns Page -->
            <div id="page-returns" class="page-section p-4 lg:p-8 hidden">
                <!-- Returns content -->
            </div>

            <!-- Reports Page -->
            <div id="page-reports" class="page-section p-4 lg:p-8 hidden">
                <!-- Reports content -->
            </div>

            <!-- Settings Page -->
            <div id="page-settings" class="page-section p-4 lg:p-8 hidden">
                <!-- Settings content -->
            </div>
            
        </div>
    </main>

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

    <!-- Modals Container -->
    <div id="modals-container"></div>

    <!-- Application Scripts -->
    <script src="js/store.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/pos.js"></script>
    <script src="js/products.js"></script>
    <script src="js/inventory.js"></script>
    <script src="js/customers.js"></script>
    <script src="js/history.js"></script>
    <script src="js/returns.js"></script>
    <script src="js/reports.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
